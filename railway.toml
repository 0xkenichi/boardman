# Railway deploy config — Boardman API + Telegram bot
# Runs the same Dockerfile.akash image used on Fly/Akash: the entrypoint
# (deploy/start_akash.py) starts BOTH the FastAPI service and the Telegram
# bot in polling mode, and restarts if either process dies.
#
# Full walkthrough: docs/RAILWAY_DEPLOY.md

$schema = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.akash"

[deploy]
startCommand = "python /app/deploy/start_akash.py"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
