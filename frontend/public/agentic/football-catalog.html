<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AFM Catalog — Boardman</title>
  <link rel="icon" href="/boardman-logo.png" />
  <link rel="stylesheet" href="/boardman-nav.css" />
  <style>
    :root {
      --bg: #050508; --panel: #0e0e14; --line: #23232f; --text: #f4f4f5;
      --muted: #9ca3af; --accent: #7c3aed; --green: #22c55e; --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Robots, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
    h1 { font-size: 1.45rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 18px; max-width: 46rem; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    input, select {
      padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
      background: #12121a; color: #fff; font-size: 0.88rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .chip {
      border: 1px solid var(--line); background: #12121a; color: #e4e4e7;
      border-radius: 999px; padding: 5px 10px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer;
    }
    .chip.on { background: #2e1065; border-color: var(--accent); color: #fff; }
    .slot { margin-bottom: 22px; }
    .slot h2 { font-size: 0.95rem; margin: 0 0 8px; letter-spacing: 0.04em; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; color: #c4b5fd; font-size: 0.7rem; text-transform: uppercase;
         letter-spacing: 0.04em; padding: 8px 8px; border-bottom: 1px solid var(--line); background: #0a0a10; }
    td { padding: 8px; border-bottom: 1px solid var(--line); color: #d4d4d8; }
    .stars { color: var(--amber); letter-spacing: 1px; }
    .inj { color: #f87171; font-size: 0.72rem; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: var(--muted); }
    a.btn {
      display: inline-block; padding: 8px 12px; border-radius: 10px;
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 0.85rem;
    }
    a.ghost { background: #1c1c24; border: 1px solid var(--line); color: #e4e4e7; }
  </style>
</head>
<body data-bm-nav>
  <div id="bm-nav-root"></div>
  <main>
    <h1>AFM player catalog</h1>
    <p class="sub">
      Top players by pitch slot. Ratings and in-game USDC price are the AFM market.
      Weekly goals / assists / form come from the API-Football oracle when the laptop hub
      refreshes — they do not rewrite match scores.
    </p>
    <div class="bar">
      <input id="q" placeholder="Search name" />
      <a class="btn ghost" href="/agentic/football-managers.html">Back to AFM</a>
      <a class="btn ghost" href="/agentic/metrics.html">Chess PNL</a>
    </div>
    <div class="chips" id="chips"></div>
    <div id="result" class="mono">Loading…</div>
  </main>
  <script src="/boardman-nav.js"></script>
  <script>
    const SLOTS = ["GK","RB","CB","LB","CDM","CM","CAM","RW","ST","LW"];
    const LABELS = {
      GK: "Goalkeepers", RB: "Right backs", CB: "Centre backs", LB: "Left backs",
      CDM: "Defensive midfield", CM: "Central midfield", CAM: "Attacking midfield",
      RW: "Right wing", ST: "Strikers", LW: "Left wing"
    };
    let all = [];
    let slotFilter = "";

    function stars(n) {
      n = Number(n) || 0;
      return "★★★★★".slice(0, n) + "☆☆☆☆☆".slice(0, 5 - n);
    }
    function usd(v) {
      const n = Number(v);
      return Number.isFinite(n) ? "$" + n.toFixed(2) : "—";
    }

    function row(p) {
      const inj = p.injury ? '<div class="inj">' + p.injury + "</div>" : "";
      return (
        "<tr>" +
          "<td><strong>" + (p.name || "") + "</strong> <span class='mono'>" + (p.nation || "") + "</span>" + inj + "</td>" +
          "<td>" + (p.slot || p.primary_pos || "") + "</td>" +
          "<td>" + (p.base_rating || p.rating || "—") + "</td>" +
          "<td class='stars'>" + stars(p.stars) + "</td>" +
          "<td>" + usd(p.game_price_usdc || p.price) + "</td>" +
          "<td>" + usd(p.wage_per_matchday_usdc || p.wage) + "</td>" +
          "<td>" + (p.form != null ? Number(p.form).toFixed(1) : "—") + "</td>" +
          "<td>" + (p.weekly_goals || 0) + " / " + (p.weekly_assists || 0) + "</td>" +
          "<td>" + (p.weekly_rating != null ? Number(p.weekly_rating).toFixed(2) : "—") + "</td>" +
        "</tr>"
      );
    }

    function table(list) {
      if (!list.length) return '<div class="mono">No players in this slot yet.</div>';
      return (
        "<table><thead><tr>" +
          "<th>Name</th><th>Slot</th><th>Rating</th><th>Stars</th><th>Price</th><th>Wage</th><th>Form</th><th>G / A</th><th>Wk rating</th>" +
        "</tr></thead><tbody>" +
        list.map(row).join("") +
        "</tbody></table>"
      );
    }

    function render() {
      const q = (document.getElementById("q").value || "").trim().toLowerCase();
      let rows = all.slice();
      if (q) rows = rows.filter((p) => (p.name || "").toLowerCase().includes(q));
      if (slotFilter) rows = rows.filter((p) => (p.slot || "") === slotFilter);
      const el = document.getElementById("result");
      if (slotFilter) {
        el.innerHTML = '<div class="slot"><h2>' + (LABELS[slotFilter] || slotFilter) + " · top " + Math.min(10, rows.length) + '</h2>' +
          table(rows.slice(0, 10)) + "</div>";
        return;
      }
      el.innerHTML = SLOTS.map((s) => {
        const list = rows.filter((p) => (p.slot || "") === s).slice(0, 10);
        return '<div class="slot"><h2>' + (LABELS[s] || s) + " · " + list.length + "</h2>" + table(list) + "</div>";
      }).join("");
    }

    function setChip(slot) {
      slotFilter = slot;
      document.querySelectorAll(".chip").forEach((c) => {
        c.classList.toggle("on", c.getAttribute("data-slot") === slot);
      });
      render();
    }

    async function load() {
      const el = document.getElementById("result");
      const urls = [
        "/api/stack/agentic/football/catalog?limit=400",
        "/agentic/afm-catalog.json",
      ];
      for (const url of urls) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (!r.ok) continue;
          const j = await r.json();
          all = j.players || [];
          if (all.length) { render(); return; }
        } catch (e) { /* next */ }
      }
      el.textContent = "Catalog unavailable. Start the Stack API or ship afm-catalog.json.";
    }

    document.getElementById("chips").innerHTML =
      '<button class="chip on" data-slot="">All slots</button>' +
      SLOTS.map((s) => '<button class="chip" data-slot="' + s + '">' + s + "</button>").join("");
    document.getElementById("chips").onclick = (e) => {
      const b = e.target.closest(".chip");
      if (b) setChip(b.getAttribute("data-slot") || "");
    };
    document.getElementById("q").oninput = render;
    load();
  </script>
</body>
</html>
