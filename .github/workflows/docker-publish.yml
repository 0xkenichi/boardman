# Manual image publish to ghcr.io/<owner>/boardman.
#
# Infra audit 2026-10 (INF-14): this used to run on every push to main in
# parallel with akash-image.yml, building the same Dockerfile.akash twice with
# packages:write. Nothing deploys from this image (the VM builds locally,
# Railway builds from the Dockerfile, Akash pulls ghcr.io/<owner>/rematch), so
# it is manual-only now. Third-party actions are pinned to commit SHAs
# (Dependabot keeps them current) and docker/metadata-action is no longer used.
name: Build & Push Docker Image

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Image name and tags
        id: meta
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "tags=${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.akash
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true
