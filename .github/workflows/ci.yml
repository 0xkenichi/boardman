# Tests for every PR and every push to main. No secrets, no deploys:
# the jobs only read the repo and public package registries.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # Same interpreter as Dockerfile / Dockerfile.akash (python:3.12-slim).
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      # Never touch a chain or a real data dir from CI; tests isolate their
      # own BOARDMAN_AGENTIC_DATA (tests/conftest.py).
      BOARDMAN_AGENTIC_ONCHAIN: "0"
      SPECTATOR_ONCHAIN: "0"
      STOCKFISH_PATH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-lock.txt

      - name: Install Stockfish (same engine the images ship)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends stockfish

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt -c src/backend/requirements-lock.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Materialize gaming/ and backend/ import shims
        # Same layout the Dockerfiles build: gaming.src.* -> src/*, backend.* -> src/backend/*
        run: |
          mkdir -p gaming
          ln -sfn ../src gaming/src
          ln -sfn ../config gaming/config
          touch gaming/__init__.py
          ln -sfn src/backend backend

      - name: pytest
        run: pytest -q tests --timeout=300

  python-postgres:
    # Production runs the agentic store on Supabase Postgres; the job above
    # only ever exercises SQLite, whose global write lock hides races that
    # Postgres row locks do not. Run the storage and money tests against a
    # real Postgres 16 (a throwaway service container, trust auth, loopback
    # only), one schema per test (tests/conftest.py).
    name: python (money paths on Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: boardman_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boardman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      BOARDMAN_AGENTIC_ONCHAIN: "0"
      SPECTATOR_ONCHAIN: "0"
      BOARDMAN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/boardman_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            src/backend/requirements.txt
            src/backend/requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt -c src/backend/requirements-lock.txt
          pip install "psycopg[binary]>=3.2" pytest pytest-asyncio pytest-timeout -c src/backend/requirements-lock.txt

      - name: Materialize gaming/ and backend/ import shims
        run: |
          mkdir -p gaming
          ln -sfn ../src gaming/src
          ln -sfn ../config gaming/config
          touch gaming/__init__.py
          ln -sfn src/backend backend

      - name: pytest (storage + money paths on Postgres)
        run: |
          python -c "import psycopg; print('psycopg', psycopg.__version__)"
          pytest -q --timeout=300 -rs \
            tests/test_storage_*.py \
            tests/test_ledger_*.py \
            tests/test_settlement_*.py \
            tests/test_escrow_replay.py \
            tests/test_spectator_*.py \
            tests/test_house_*.py \
            tests/test_afm_betting.py \
            tests/test_afm_market_settlement.py \
            tests/test_sec_football_*.py

  frontend:
    name: frontend (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Terms copy matches docs/TERMS_OF_SERVICE.md (npm run sync:legal)
        run: cmp ../docs/TERMS_OF_SERVICE.md content/legal/TERMS_OF_SERVICE.md
      - run: npx tsc --noEmit
      - run: npm run build

  contracts:
    name: contracts (hardhat test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Cache solc compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-${{ runner.os }}-${{ hashFiles('contracts/hardhat.config.js', 'contracts/package-lock.json') }}
      - run: npm ci
      - run: npx hardhat test

  afm:
    name: engines/afm/${{ matrix.package }} (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [match-contracts, engine-adapter]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            engines/afm/match-contracts/package-lock.json
            engines/afm/engine-adapter/package-lock.json
      # engine-adapter links ../match-contracts (file: dep), whose own deps
      # (zod) must be installed for the link to resolve.
      - name: Install match-contracts
        working-directory: engines/afm/match-contracts
        run: npm ci
      - name: Install ${{ matrix.package }}
        if: matrix.package != 'match-contracts'
        working-directory: engines/afm/${{ matrix.package }}
        run: npm ci
      - name: Typecheck
        working-directory: engines/afm/${{ matrix.package }}
        run: npx tsc --noEmit
      - name: Test
        working-directory: engines/afm/${{ matrix.package }}
        run: npx vitest run

  docker:
    # Build the production image on every PR (no push, no secrets) so a
    # Dockerfile or dependency change is proven before it reaches main and the
    # VM. amd64 only: the VM is arm64, but the build logic and the lock are the
    # same; akash-image.yml re-checks the pushed image on main.
    name: docker (build Dockerfile.akash + smoke import)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f Dockerfile.akash -t boardman:ci .
      - name: Smoke (runs as non-root, no compiler, API imports)
        run: |
          docker run --rm --entrypoint sh boardman:ci -c '
            test "$(id -u)" != 0 || { echo "image runs as root"; exit 1; }
            ! command -v gcc || { echo "compiler in runtime image"; exit 1; }
            cd /app && python -c "import gaming.src.backend.main; print(\"SMOKE_OK\")"'

  supply-chain:
    # Known-vulnerability scan of the pinned Python set and the frontend
    # lockfile. Informational until the first green run (then drop
    # continue-on-error). PYSEC-2026-1325 (ecdsa via python-jose) has no fix
    # upstream; see the note in src/backend/requirements.txt.
    name: supply-chain (pip-audit + npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (requirements-lock.txt)
        run: |
          python -m pip install pip-audit
          pip-audit --strict --no-deps --disable-pip -r src/backend/requirements-lock.txt \
            --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
