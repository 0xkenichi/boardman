# Build & push Rematch image for Akash (GHCR).
# Image: ghcr.io/<owner>/rematch:latest
#
# After first successful run:
#   1. Make package public (or set registry creds in Akash) —
#      GitHub → Packages → rematch → Package settings → Change visibility
#   2. deploy/akash/deploy.yml → image: ghcr.io/<owner>/rematch:latest
#   3. Upload SDL on https://console.akash.network/

name: Akash image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.akash"
      - "deploy/start_akash.sh"
      - "src/**"
      - "config/**"
      - ".github/workflows/akash-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/rematch" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${OWNER}/rematch:latest,ghcr.io/${OWNER}/rematch:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.akash
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
