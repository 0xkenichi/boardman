  celo_alfajores:
    id: celo_alfajores
    label: Celo Alfajores
    enabled: false
    recommended: false
    status: testnet
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: ""
    chain_id: 44787
    rpc_url: https://alfajores-forno.celo-testnet.org
    explorer_tx: https://alfajores.celoscan.io/tx/
