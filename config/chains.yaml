# Settlement policy (see also config/funding_rails.yaml)
# Stakes / BoardmanEscrow ALWAYS on default_settlement_chain (arc) until a
# rail has usdc_gas + can_stake. Stellar & Avalanche are funding rails only.
settlement:
  chain: arc
  force_convert_for_stake: true
  abstract_balance: true   # players see one USDC number

# Circle CCTP v2 (https://developers.circle.com/cctp). Same contract addresses
# on every EVM chain except EDGE. Domains live on each chain above
# (cctp_domain). Arc: domain 26, no Fast Transfer as source (attests fast
# anyway); Base: domain 6, Fast Transfer supported.
cctp:
  mainnet:
    token_messenger_v2: "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
    message_transmitter_v2: "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
    iris_api: "https://iris-api.circle.com"
  testnet:
    token_messenger_v2: "0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA"
    message_transmitter_v2: "0xE737e5cEBEEBa77EFE34D4aa090756590b1CE275"
    iris_api: "https://iris-api-sandbox.circle.com"
  network_of:
    arc: testnet
    base: testnet
    arc_mainnet: mainnet
    base_mainnet: mainnet

# Phase C: bridge funding rails → Arc play wallet (CCTP / ops).
bridge:
  enabled: false
  extra_fee_bps: 50   # +0.5% on top of platform 7% when we bridge for them
  supported_sources: [stellar, avalanche, base, arc, goat, goat_testnet]
  target: arc
