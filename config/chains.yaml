# ClawStation / Rematch settlement chains
#
# Product posture (now):
#   - NETWORK: testnet
#   - LIVE for users: Arc only
#   - NEXT: Avalanche Fuji (funding; Team1 grant path)
#   - PLANNED: GOAT Testnet3 (ERC-8004 identity + x402; not settlement)
#   - Base Sepolia: legacy / internal, not offered in product UI
#
# enabled: false chains stay in this file for deploy prep but are hidden from
# list_chains() / Stack catalog / user-facing "supported chains" help.

default_settlement_chain: arc

# Money realms (src/backend/services/realms.py). Real money never mixes with
# practice money: every chain below carries `network: mainnet|testnet`, and a
# realm may only use chains of its own network.
#   humans  friend challenges between people with REAL USDC (naira top-up and
#           cash-out via Paycrest, Circle wallets, passkey wallets). Live only
#           when REAL_MONEY_ENABLED=1 and the chain's escrow is configured.
#   arena   AI arena, spectator betting, AFM football, the football-ledger
#           wallet bridge, faucet: practice chips only (testnet USDC).
# default_settlement_chain / CLAW_DEFAULT_CHAIN stay on the arena chain: they
# are the legacy "default" for every older code path and must never be real.
realms:
  humans:
    chain: arc_mainnet   # override: BOARDMAN_HUMANS_CHAIN (must be network: mainnet)
  arena:
    chain: arc           # override: BOARDMAN_ARENA_CHAIN (must be network: testnet)

chains:
  arc:
    id: arc
    label: Arc Testnet
    enabled: true
    recommended: true
    status: live
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: ARC-TESTNET
    chain_id: 5042002
    rpc_url: https://rpc.testnet.arc.network
    explorer_tx: https://testnet.arcscan.app/tx/
    usdc_address: "0x3600000000000000000000000000000000000000"
    # Circle W3S token UUID for ERC-20 USDC facade (approve/transfer). Override: CIRCLE_USDC_TOKEN_ID_ARC
    circle_usdc_token_id: "ef87c8c3-85de-598a-af50-c5135eecfa74"
    gas_token: USDC
    gas_mode: usdc_native
    gas_tank_required: false
    # BoardmanEscrow V1-tiered (2026-09). Override: CLAW_ESCROW_ADDRESS_ARC / BOARDMAN_ESCROW_ADDRESS_ARC
    # Previous flat-fee V1: 0xD8984396f12Cd0BD3C3e120858dd7eCdEeEF66Fc · V0 archive: 0xFC44a06295d4fC58420027932A6FcB3C13D83859
    escrow_address: "0xD382f627fB565eb96D9EFFb66B9119DD4a555847"
    escrow_contract: BoardmanEscrow
    escrow_version: 1
    # SpectatorPool tiered (2026-09). Override: SPECTATOR_ESCROW_ADDRESS
    # Previous flat-fee pool: 0x7Dcd347fA916bF93Ad8BF3c1c8e9D17111B5313e
    spectator_pool_address: "0xd45bE49456021B74D2712fcffD47f17f91D39664"
    fee_recipient: "0xFA931C535C9d10A324Ea7417a63ed22dD9b0cb2E"
    cctp_domain: 26
    notes: "Boardman V1. Gas paid in USDC. Best UX."

  # Arc Mainnet — live since Sept 16 2026. Same USDC predeploy address as testnet.
  # circle_usdc_token_id: mainnet Circle W3S token id NOT yet known — set via env
  # CIRCLE_USDC_TOKEN_ID_ARC_MAINNET before wallet fan-out. Escrow TBD at deploy.
  arc_mainnet:
    id: arc_mainnet
    label: Arc Mainnet
    enabled: false
    recommended: false
    status: prep
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: ARC
    chain_id: 5042
    rpc_url: https://rpc.mainnet.arc.io
    explorer_tx: https://explorer.arc.io/tx/
    usdc_address: "0x3600000000000000000000000000000000000000"
    circle_usdc_token_id: ""
    gas_token: USDC
    gas_mode: usdc_native
    gas_tank_required: false
    escrow_address: ""
    escrow_contract: BoardmanEscrow
    # v2 safety escrow (Ownable2Step, resolver createMatch permits). Override:
    # BOARDMAN_ESCROW_ADDRESS_ARC_MAINNET. Owner = Safe (or founder wallet fallback).
    escrow_version: 2
    fee_recipient: "0xFA931C535C9d10A324Ea7417a63ed22dD9b0cb2E"
    cctp_domain: 26
    notes: "Deploy BoardmanEscrow + confirm Circle W3S token id before enabling."

  avalanche:
    id: avalanche
    label: Avalanche Fuji
    # Settlement/escrow UI still Arc-only; Avalanche is a funding rail (see funding_rails.yaml).
    enabled: false
    recommended: false
    status: funding
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: AVAX-FUJI
    chain_id: 43113
    rpc_url: https://api.avax-test.network/ext/bc/C/rpc
    explorer_tx: https://testnet.snowtrace.io/tx/
    usdc_address: "0x5425890298aed601595a70AB815c96711a31Bc65"
    circle_usdc_token_id: ""
    gas_token: AVAX
    gas_mode: native_avax
    gas_tank_required: true
    gas_tank_min_wei: "10000000000000000"   # 0.01 AVAX
    gas_tank_topup_wei: "50000000000000000" # 0.05 AVAX
    escrow_address: "0xFC44a06295d4fC58420027932A6FcB3C13D83859"
    notes: "Funding rail only until USDC gas + BoardmanEscrow. Convert → Arc for stakes."

  # Stellar is NOT EVM — not used for BoardmanEscrow. Payments / USDC funding only.
  # Horizon + ops address live in funding_rails.yaml / env (BOARDMAN_OPS_USDC_STELLAR).
  stellar:
    id: stellar
    label: Stellar
    enabled: false
    recommended: false
    status: funding
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: ""
    chain_id: 0
    rpc_url: ""
    explorer_tx: "https://stellar.expert/explorer/public/tx/"
    usdc_address: ""
    circle_usdc_token_id: ""
    gas_token: XLM
    gas_mode: stellar_native
    gas_tank_required: false
    escrow_address: ""
    notes: "Path A: fund with USDC on Stellar → credit Arc play balance. No on-chain stakes here."

  base:
    id: base
    label: Base Sepolia
    enabled: false
    recommended: false
    status: legacy
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: BASE-SEPOLIA
    chain_id: 84532
    rpc_url: https://sepolia.base.org
    explorer_tx: https://sepolia.basescan.org/tx/
    usdc_address: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
    circle_usdc_token_id: "bdf128b4-827b-5267-8f9e-243694989b5f"
    gas_token: ETH
    gas_mode: native_eth
    gas_tank_required: true
    gas_tank_min_wei: "100000000000000"   # 0.0001 ETH
    gas_tank_topup_wei: "1000000000000000" # 0.001 ETH
    escrow_address: "0xDb76714390ccE1729558DF3c9EC4f45A1690dE78"
    cctp_domain: 6
    notes: "Legacy testnet path. Kept for internal/ops; not in product UI."

  # Base mainnet: Paycrest's delivery chain for the naira rail ONLY
  # (config/funding_rails.yaml paycrest_ngn). Never a stake chain: USDC that
  # lands here is bridged to the Arc play wallet with CCTP v2.
  # circle_usdc_token_id: set CIRCLE_USDC_TOKEN_ID_BASE_MAINNET (Circle W3S
  # token UUID for USDC on BASE) before the first transfer.
  base_mainnet:
    id: base_mainnet
    label: Base
    enabled: false
    recommended: false
    status: funding
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: BASE
    chain_id: 8453
    rpc_url: https://mainnet.base.org
    explorer_tx: https://basescan.org/tx/
    usdc_address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    circle_usdc_token_id: ""
    gas_token: ETH
    gas_mode: native_eth
    gas_tank_required: true
    gas_tank_min_wei: "20000000000000"     # 0.00002 ETH (hot_wallet gas mode only)
    gas_tank_topup_wei: "100000000000000"  # 0.0001 ETH
    escrow_address: ""
    cctp_domain: 6
    notes: "Paycrest delivery chain (naira on/off-ramp). Funding only; bridged to Arc."

  # Celo — MiniPay host / Proof-of-Ship (Research Tech Build)
  # Settlement still defaults to Arc; Celo is enabled for MiniPay UX + future USDC rail.
  celo:
    id: celo
    label: Celo
    enabled: true
    recommended: false
    status: minipay
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: ""   # not via Circle W3S yet — MiniPay provider path
    chain_id: 42220
    rpc_url: https://forno.celo.org
    explorer_tx: https://celoscan.io/tx/
    usdc_address: "0xcebA9300f2b948710d2653dD7B07f33A8B32118C"  # USDC on Celo
    circle_usdc_token_id: ""
    gas_token: CELO
    gas_mode: native_celo
    gas_tank_required: false
    escrow_address: ""
    notes: "MiniPay / Proof-of-Ship. Host shell live; dual-lock escrow on Celo optional later."

  # GOAT Network — Bitcoin-secured EVM L2. Supplier rail for agent identity (ERC-8004)
  # and x402 pay-to-challenge / pay-to-watch. Skill escrow stays on Arc until we
  # deploy BoardmanEscrow here.
  goat:
    id: goat
    label: GOAT Network
    enabled: false
    recommended: false
    status: planned
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: ""
    chain_id: 2345
    rpc_url: https://rpc.goat.network
    explorer_tx: https://explorer.goat.network/tx/
    usdc_address: ""
    circle_usdc_token_id: ""
    gas_token: BTC
    gas_mode: native_btc
    gas_tank_required: true
    escrow_address: ""
    notes: "Supplier: ERC-8004 + x402. Do not stake here until escrow is deployed."

  # 0G Chain — AI L1. WaveHack / Agentic ID (ERC-7857) + match proofs.
  # Skill pots stay on Arc.
  "0g":
    id: "0g"
    label: 0G Mainnet
    enabled: false
    recommended: false
    status: planned
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: mainnet
    circle_blockchain: ""
    chain_id: 16661
    rpc_url: https://evmrpc.0g.ai
    explorer_tx: https://chainscan.0g.ai/tx/
    usdc_address: ""
    circle_usdc_token_id: ""
    gas_token: 0G
    gas_mode: native_0g
    gas_tank_required: true
    escrow_address: ""
