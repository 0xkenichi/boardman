  "0g_testnet":
    id: "0g_testnet"
    label: 0G Testnet
    enabled: false
    recommended: false
    status: planned
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: ""
    chain_id: 16602
    rpc_url: https://evmrpc-testnet.0g.ai
    explorer_tx: https://chainscan-galileo.0g.ai/tx/
    usdc_address: ""
    circle_usdc_token_id: ""
    gas_token: 0G
    gas_mode: native_0g
    gas_tank_required: true
    escrow_address: ""
    notes: "Galileo-style testnet (chainId 16602 in 0G Hardhat docs). Wave 3 still wants mainnet proof."

  goat_testnet:
    id: goat_testnet
    label: GOAT Testnet3
    enabled: false
    recommended: false
    status: planned
    # Money realm: mainnet = real money (humans only); testnet = practice chips.
    network: testnet
    circle_blockchain: ""
    chain_id: 48816
    rpc_url: https://rpc.testnet3.goat.network
    explorer_tx: https://explorer.testnet3.goat.network/tx/
    usdc_address: ""
    circle_usdc_token_id: ""
    gas_token: BTC
    gas_mode: native_btc
    gas_tank_required: true
