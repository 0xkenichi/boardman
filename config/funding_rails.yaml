# Boardman multi-rail money model
#
# Product rule:
#   - Players see ONE abstract USDC balance ("play money").
#   - They may fund via Avalanche USDC (their play wallet), Stellar USDC or Naira.
#   - All stakes / BoardmanEscrow locks settle on the settlement rail only.
#   - Settlement rail = Avalanche C-Chain (BoardmanEscrow v2; AVAX gas covered
#     by the platform gas tank, services/gas_tank.py).
#   - Other rails are funding only until they carry a dual-lock escrow.
#
# Convert policy:
#   - Funds that arrive on a non-settlement rail are converted into the
#     settlement play wallet (manual ops float now; CCTP/bridge later).

settlement_rail: avalanche

# When true, lock_stake refuses if spendable on settlement rail < stake
# even if user has USDC sitting on funding rails (must convert first).
require_settlement_for_stake: true

# Hide chain names in player copy; use labels below instead.
player_copy:
  balance_label: "Play balance"
  settlement_label: "ready to play"
  pending_label: "on the way / other wallet"
  convert_hint: "We'll move it into play money before your next stake."

rails:
  avalanche:
    id: avalanche
    kind: settlement          # funding + stake; AVAX gas from the platform gas tank
    enabled: true
    player_label: "Play wallet"
    admin_label: "Avalanche C-Chain (settlement)"
    usdc_gas: false           # gas is AVAX; services/gas_tank.py tops play wallets up
    can_stake: true           # BoardmanEscrow v2 lives here
    deposit_mode: play_address  # each user has their own Avalanche address
    notes: "Home rail. Stakes always land here."

  # Kept configured for the multi-chain code; not offered in this build.
  arc:
    id: arc
    kind: funding
    enabled: false
    player_label: "USDC (Arc)"
    admin_label: "Arc testnet (not offered)"
    usdc_gas: true
    can_stake: false
    deposit_mode: ops_address
    notes: "Not offered in the Avalanche build."

  stellar:
    id: stellar
    kind: funding
    enabled: true
    player_label: "USDC (Stellar)"
    admin_label: "Stellar USDC"
    usdc_gas: true            # Stellar fees tiny / asset-native UX
    can_stake: false          # no BoardmanEscrow on Stellar (not EVM)
    deposit_mode: ops_address
    env_ops_address: BOARDMAN_OPS_USDC_STELLAR
    env_ops_memo_prefix: BOARDMAN_STELLAR_MEMO_PREFIX
    network_env: STELLAR_NETWORK   # testnet | public
    horizon_env: STELLAR_HORIZON_URL
    notes: "Path A payments rail. SEP-24 anchors later; memo deposits now."

  paystack_ngn:
    id: paystack_ngn
    kind: funding
    enabled: false            # real naira: off until licensed
    player_label: "Pay with Naira"
    can_stake: false
    deposit_mode: fiat
    notes: "Existing Paystack → ops credits Arc play wallet."

  goat:
    id: goat
    kind: supplier              # identity + x402; not play-balance funding yet
    enabled: false
    player_label: "GOAT (agent identity)"
    admin_label: "GOAT Network / Testnet3"
    usdc_gas: false
    can_stake: false
    deposit_mode: none
    notes: "ERC-8004 + x402. Bridge receipts to Arc play wallet later."

  bank_ngn:
    id: bank_ngn
    kind: funding
    enabled: false            # real naira: off until licensed
    player_label: "Bank transfer (Naira)"
    can_stake: false
    deposit_mode: fiat

  # Naira on/off-ramp through Paycrest (docs/payments/PAYCREST.md).
  # REAL MONEY, MAINNET ONLY (Paycrest has no testnet). Paycrest does not
  # support Arc, so naira lands as USDC on Base and is bridged to the player's
  # Arc play wallet with Circle CCTP v2; cash-outs go the other way.
  #
  # `enabled` stays false here: the live switch is the environment, and BOTH
  # PAYCREST_ENABLED=1 and REAL_MONEY_ENABLED=1 (plus PAYCREST_API_KEY) are
  # required before a player sees anything. Read every value through
  # src/backend/services/paycrest/config.py, not directly.
  paycrest_ngn:
    id: paycrest_ngn
    kind: funding
    enabled: false
    player_label: "Top up with naira (Paycrest)"
    admin_label: "Paycrest NGN <-> USDC on Base, CCTP to Avalanche"
    can_stake: false
    deposit_mode: fiat
    api_base: "https://api.paycrest.io/v2"
    network: base              # Paycrest network id (lowercase)
    token: USDC
    currency: NGN
    delivery_chain: base_mainnet   # chains.yaml id where Paycrest pays out / takes USDC
    settlement_chain: avalanche_mainnet  # chains.yaml id of the player's play wallet
    # Our optional fee on top of Paycrest's (Paycrest's own ~0.5% is inside its rate).
    sender_fee_percent: "0"
    # Who pays Paycrest's network fee: customer (shown to the player) | sender
    transaction_fee_payer: customer
    # Customer KYC on on-ramp orders (Paycrest requires source.kyc since Oct 2026).
    # pass_through: collected on a one-time web page, forwarded to Paycrest,
    # never stored by Boardman. See PAYCREST.md "KYC".
    kyc_mode: pass_through
    kyc_id_types: [BVN, nationalID]   # BVN, or NIN sent as nationalID
    limits:
      onramp_min_ngn: 1000
      onramp_max_ngn: 500000        # per order
      onramp_daily_ngn: 1000000     # per player, rolling 24h
      offramp_min_usdc: "1"         # Paycrest minimum is $0.50; keep headroom for fees
      offramp_max_usdc: "300"       # per cash-out
      offramp_daily_usdc: "500"     # per player, rolling 24h
      quote_ttl_sec: 600
    bridge:
      # Base -> Avalanche after an on-ramp; Avalanche -> Base before an off-ramp.
      onramp_fast_transfer: true    # CCTP Fast Transfer from Base (fee in bps, quoted by Circle)
      max_fee_bps: 5                # refuse to burn if Circle's fast fee is above this
      min_sweep_usdc: "0.50"
      max_attempts: 8
    gas:
      # How the player's Base wallet pays ETH gas for approve/burn/transfer:
      #   gas_station: Circle Gas Station sponsors gas (needs SCA wallets on Base)
      #   hot_wallet:  Boardman's funded Base wallet tops up ETH (services/gas_tank.py)
      base_mode: gas_station
      base_account_type: SCA
      # Destination mints are relayed by Boardman wallets (anyone may call
      # receiveMessage when destinationCaller is zero). Wallet ids come from env:
      #   PAYCREST_AVALANCHE_RELAYER_WALLET_ID, PAYCREST_BASE_RELAYER_WALLET_ID

bridge:
  # Auto-move funding-rail USDC → Avalanche play wallet
  auto_convert_to_settlement: false   # true when CCTP/ops bot is live
  mode: manual_ops                    # manual_ops | cctp | partner (paycrest_ngn bridges with CCTP on its own)
  extra_fee_bps: 0                    # charge 0 for now; raise if bridge costs
  supported_sources:
    - stellar
    - base
  target: avalanche
