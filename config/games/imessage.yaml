# iMessage / GamePigeon catalog — finite-outcome 1v1 only
# Used by challenge wizard + AI proof hints (see docs/IMESSAGE_AND_CHANNELS.md)

category: imessage
default_proof: screenshot
default_stake_min_usdc: 1
default_stake_max_usdc: 25

games:
  - game_id: imessage.8_ball
    display_name: "8 Ball"
    enabled: true
    outcome_type: binary_winner
    result_screen: "GamePigeon iMessage bubble — flat cartoon table; You Win / You Lose after 8-ball"
    ai_hints:
      - "GamePigeon 8 Ball inside iMessage (flat 2D cartoon table, Messages chrome)"
      - "Accept only final state: You Win, You Lose, or winner after 8-ball sunk"
      - "NOT Miniclip 8 Ball Pool (no 3D avatars, no gold Winner VS screen, no piggy prize)"
      - "Reject mid-shot aiming, power bar only, or table without end banner"
    duration_hint_min: 15

  - game_id: imessage.basketball
    display_name: "Basketball"
    enabled: true
    outcome_type: scoreline
    result_screen: "Final points both players in GamePigeon bubble"
    ai_hints:
      - "GamePigeon Basketball end — two numeric scores for both players"
      - "Extract home/left and away/right point totals as integers"
      - "Reject mid-shot hoop UI without final totals"
    duration_hint_min: 10

  - game_id: imessage.archers
    display_name: "Archers"
    enabled: true
    outcome_type: scoreline
    result_screen: "Final archery points both players"
    ai_hints:
      - "GamePigeon Archers / Archery final points both sides"
      - "Reject mid-round aiming without final scoreboard"
    duration_hint_min: 10

  - game_id: imessage.darts
    display_name: "Darts"
    enabled: true
    outcome_type: scoreline
    result_screen: "Final dart scores both players"
    ai_hints:
      - "GamePigeon Darts final scoreboard — both player totals"
      - "Reject in-progress dartboard only"
    duration_hint_min: 15

  - game_id: imessage.sea_battle
    display_name: "Sea Battle"
    enabled: true
    outcome_type: binary_winner
    result_screen: "Fleet destroyed / You Win in chat bubble"
    ai_hints:
      - "GamePigeon Sea Battle end — You Win or fleet destroyed"
      - "Reject mid-grid without winner banner"
    duration_hint_min: 20

  - game_id: imessage.cup_pong
    display_name: "Cup Pong"
    enabled: true
    outcome_type: binary_winner
    result_screen: "Cups cleared / You Win"
    ai_hints:
      - "GamePigeon Cup Pong final — cups gone or You Win"
      - "Reject mid-throw without winner"
    duration_hint_min: 15

  - game_id: imessage.word_hunt
    display_name: "Word Hunt"
    enabled: true
    outcome_type: scoreline
    result_screen: "Points both players after timer"
    ai_hints:
      - "GamePigeon Word Hunt end — both SCORE totals (often thousands)"
      - "Extract two integer scores; higher score wins for verification"
      - "Reject letter grid mid-timer without final scores"
    duration_hint_min: 5

  - game_id: imessage.anagrams
    display_name: "Anagrams"
    enabled: true
    outcome_type: scoreline
    result_screen: "Final points both players"
    ai_hints:
      - "GamePigeon Anagrams final points both players"
      - "Reject mid-game letter tiles only"
    duration_hint_min: 5

  - game_id: imessage.four_in_a_row
    display_name: "4 in a Row"
    enabled: true
    outcome_type: binary_winner
    result_screen: "Four connected / You Win"
    ai_hints:
      - "GamePigeon 4 in a Row / Connect Four — You Win or four-in-a-row highlight"
      - "Reject mid-board without win state"
    duration_hint_min: 10

  - game_id: imessage.checkers
    display_name: "Checkers"
    enabled: true
    outcome_type: binary_winner
    result_screen: "You Win / winner banner"
    ai_hints:
      - "GamePigeon Checkers end — You Win or no pieces left for loser"
      - "Reject mid-game only"
    duration_hint_min: 20

  - game_id: imessage.chess
    display_name: "Chess"
    enabled: true
    outcome_type: binary_winner  # draws: policy later
    result_screen: "Checkmate / resign / You Win (known quirky stalemate copy)"
    ai_hints:
      - "GamePigeon Chess game over — checkmate, resign, You Win / I lost messaging"
      - "Binary win only; draws need human review"
      - "Reject mid-game board without game-over"
    duration_hint_min: 30

  - game_id: imessage.mini_golf
    display_name: "Mini Golf"
    enabled: true
    outcome_type: scoreline  # lower strokes wins — encode in verifier later
    result_screen: "Stroke totals both players"
    ai_hints:
      - "GamePigeon Mini Golf final stroke totals both players"
      - "Lower strokes is better — still report both numbers as scoreline"
      - "Reject mid-hole only"
    duration_hint_min: 20

  # deferred examples (enabled: false until proof quality is solid)
  - game_id: imessage.knockout
    display_name: "Knockout"
    enabled: false
    outcome_type: binary_winner
    result_screen: "Last standing"
    ai_hints: []
    notes: "Only enable if final screen is unambiguous"
