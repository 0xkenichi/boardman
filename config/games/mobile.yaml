# Mobile games catalog — finite-outcome 1v1 / agreed modes only
# See docs/MOBILE_GAMES.md · docs/RESULT_SCREENS_BY_GAME.md · docs/WEBAPP_AND_MINIPAY.md
#
# Rules:
#   - Clear final screen (Victory/Defeat or scoreline)
#   - Private room / 1v1 / deathmatch / TDM — NOT open battle royale placement

category: mobile
default_proof: screenshot
default_stake_min_usdc: 1
default_stake_max_usdc: 25

games:
  # ═══════════════════════════════════════════════════════════════════════
  # Sports / sims
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.fc_mobile
    display_name: "FC Mobile"
    enabled: true
    outcome_type: scoreline
    emoji: "⚽"
    platforms: ["ios", "android"]
    result_screen: "Mobile FT / full-time scoreboard — both team goals, names/crests"
    ai_hints:
      - "EA Sports FC Mobile full-time / FT phone scoreboard (not console EA FC TV pack)"
      - "Large home and away goal integers; team names or crests when visible"
      - "Look for Full Time, FT, or match result after whistle"
      - "Reject mid-match HUD, VSA chance-only, or formation/squad screens"
    duration_hint_min: 20
    notes: "Flagship mobile sports title"

  - game_id: mobile.efootball
    display_name: "eFootball"
    enabled: true
    outcome_type: scoreline
    emoji: "⚽"
    platforms: ["ios", "android"]
    result_screen: "Final score both teams (KONAMI mobile UI)"
    ai_hints:
      - "eFootball mobile full-time scoreline both clubs"
      - "Extract home/away goals as integers"
      - "Reject mid-match camera only"
    duration_hint_min: 20

  - game_id: mobile.nba_2k_mobile
    display_name: "NBA 2K Mobile"
    enabled: true
    outcome_type: scoreline
    emoji: "🏀"
    platforms: ["ios", "android"]
    result_screen: "Final box / end-of-game team points"
    ai_hints:
      - "NBA 2K Mobile final score — two team point totals"
      - "Reject mid-quarter HUD without final totals"
    duration_hint_min: 25

  # ═══════════════════════════════════════════════════════════════════════
  # Casual / pool
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.8_ball_pool
    display_name: "8 Ball Pool"
    enabled: true
    outcome_type: binary_winner
    emoji: "🎱"
    platforms: ["ios", "android"]
    result_screen: >
      Post-match VS screen: gold "Winner" over one avatar, two player
      portraits with usernames, coin/piggy prize, pool table background.
    ai_hints:
      - "Miniclip 8 Ball Pool end-of-match VS screen (cartoon avatars on pool table)"
      - "Gold text Winner above the winning avatar; usernames under portraits"
      - "Prize coins / piggy often between players; Share/Rematch buttons OK"
      - "Encode 1-0 if left/device under Winner, 0-1 if right/local lost"
      - "Extract usernames to player1_id / player2_id when visible"
      - "NOT GamePigeon iMessage 8 Ball (no flat chat bubble table)"
      - "Reject mid-game table, lobby, cue shop, XP-only popup"
    duration_hint_min: 10
    notes: "Miniclip 8 Ball Pool 1v1. Distinct from iMessage GamePigeon 8 Ball."

  # ═══════════════════════════════════════════════════════════════════════
  # Free Fire
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.free_fire_1v1
    display_name: "Free Fire 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔥"
    platforms: ["ios", "android"]
    result_screen: "Victory / Defeat on 1v1 duel (not BR Booyah rank)"
    ai_hints:
      - "Garena Free Fire 1v1 / custom duel result — Victory or Defeat banner"
      - "Reject classic BR placement list, Booyah rank, or #N survival card"
    duration_hint_min: 15
    notes: "Private 1v1 / duel only"

  - game_id: mobile.free_fire_cs
    display_name: "Free Fire Clash Squad"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔥"
    platforms: ["ios", "android"]
    result_screen: "Clash Squad team Victory / Defeat after rounds"
    ai_hints:
      - "Free Fire Clash Squad end — team Victory or Defeat"
      - "Not classic BR Booyah placement"
    duration_hint_min: 20
    notes: "Agreed 2v2/4v4 CS — still one economic rep per side if staking as 1v1 wallets"

  # ═══════════════════════════════════════════════════════════════════════
  # COD Mobile
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.cod_mobile_dm
    display_name: "COD Mobile Deathmatch"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "MP end scoreboard / Victory for DM or FFA"
    ai_hints:
      - "COD Mobile multiplayer end — Victory/Defeat + scoreboard"
      - "Deathmatch or free-for-all ranking; not Warzone BR placement-only"
    duration_hint_min: 15

  - game_id: mobile.cod_mobile_tdm
    display_name: "COD Mobile TDM"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "Team Deathmatch Victory / final team scores"
    ai_hints:
      - "COD Mobile TDM result — team score and Victory/Defeat"
      - "Reject BR placement card"
    duration_hint_min: 15

  - game_id: mobile.cod_mobile_1v1
    display_name: "COD Mobile 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "Private match 1v1 Victory/Defeat"
    ai_hints:
      - "COD Mobile private/custom 1v1 Victory or Defeat"
      - "Prefer private lobby proof; reject random ranked BR"
    duration_hint_min: 15
    notes: "Private lobby preferred"

  # ═══════════════════════════════════════════════════════════════════════
  # PUBG / BGMI
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.pubg_tdm
    display_name: "PUBG Mobile TDM"
    enabled: true
    outcome_type: binary_winner
    emoji: "🎯"
    platforms: ["ios", "android"]
    result_screen: "TDM team win / final team scores"
    ai_hints:
      - "PUBG Mobile TDM Victory/Defeat or team score end"
      - "Not classic BR chicken dinner placement-only"
    duration_hint_min: 15
    notes: "TDM only — not classic BR"

  - game_id: mobile.pubg_1v1
    display_name: "PUBG Mobile 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🎯"
    platforms: ["ios", "android"]
    result_screen: "Custom room duel Victory"
    ai_hints:
      - "PUBG Mobile custom 1v1 Victory/Defeat"
      - "Reject classic BR #placement alone"
    duration_hint_min: 15

  - game_id: mobile.bgmi_tdm
    display_name: "BGMI TDM"
    enabled: true
    outcome_type: binary_winner
    emoji: "🎯"
    platforms: ["android"]
    result_screen: "TDM final team result"
    ai_hints:
      - "BGMI Team Deathmatch Victory/Defeat"
      - "Not classic BR placement"
    duration_hint_min: 15
    notes: "India PUBG variant"

  # ═══════════════════════════════════════════════════════════════════════
  # Valorant
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.valorant_1v1
    display_name: "Valorant 1v1 / Custom"
    enabled: true
    outcome_type: binary_winner
    emoji: "🗡️"
    platforms: ["ios", "android", "pc"]
    result_screen: "Custom game VICTORY / DEFEAT splash + round score"
    ai_hints:
      - "Valorant end — large VICTORY or DEFEAT with agents and round tally"
      - "Custom or agreed 1v1; not ranked 5v5 multi-wallet"
      - "Reject agent select / mid-round HUD only"
    duration_hint_min: 25
    notes: "Custom 1v1 / agreed mode — not ranked 5v5 as multi-wallet"

  - game_id: mobile.valorant_dm
    display_name: "Valorant Deathmatch"
    enabled: true
    outcome_type: binary_winner
    emoji: "🗡️"
    platforms: ["ios", "android", "pc"]
    result_screen: "DM end leaderboard — agreed top fragger / duel"
    ai_hints:
      - "Valorant Deathmatch end scoreboard / first place"
      - "Only with clear 1v1 agreement; full FFA is weaker proof"
    duration_hint_min: 15
    notes: "Use only with clear 1v1 agreement; full FFA DM is weaker proof"

  # ═══════════════════════════════════════════════════════════════════════
  # Other popular mobile (finite 1v1)
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.clash_royale
    display_name: "Clash Royale"
    enabled: true
    outcome_type: binary_winner
    emoji: "👑"
    platforms: ["ios", "android"]
    result_screen: "Post-battle Victory/Defeat + crowns (1–3); King Tower = 3-crown"
    ai_hints:
      - "Clash Royale end-of-battle Victory or Defeat banner"
      - "Crowns = towers destroyed (1–3); three crowns = King Tower down"
      - "Trophy change often shown; binary W/L for Rematch"
      - "Reject deck builder, shop, or Pass progress alone"
    duration_hint_min: 5

  - game_id: mobile.brawl_stars_1v1
    display_name: "Brawl Stars 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "⭐"
    platforms: ["ios", "android"]
    result_screen: "Showdown / agreed 1v1 Victory"
    ai_hints:
      - "Brawl Stars Victory screen after 1v1 or agreed Showdown"
      - "Reject 3v3 ranked noise unless both agreed that mode"
    duration_hint_min: 5

  - game_id: mobile.mlbb_1v1
    display_name: "MLBB Custom 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "⚔️"
    platforms: ["ios", "android"]
    result_screen: "Custom / 1v1 Victory splash"
    ai_hints:
      - "Mobile Legends Victory or Defeat after custom/1v1"
      - "Custom room preferred; reject random 5v5 ranked as sole proof"
    duration_hint_min: 20
    notes: "Custom 1v1 only"

  - game_id: mobile.wild_rift_1v1
    display_name: "Wild Rift Custom 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🛡️"
    platforms: ["ios", "android"]
    result_screen: "Custom game Victory"
    ai_hints:
      - "Wild Rift custom match Victory/Defeat"
      - "Custom 1v1 only"
    duration_hint_min: 25

  - game_id: mobile.genshin_tcg
    display_name: "Genshin TCG 1v1"
    enabled: false
    outcome_type: binary_winner
    emoji: "🃏"
    platforms: ["ios", "android", "pc"]
    result_screen: "Genius Invokation win"
    ai_hints:
      - "Genshin TCG victory screen"
    duration_hint_min: 20
    notes: "Enable when screenshot layout is stable"

  - game_id: mobile.chess_com
    display_name: "Chess (mobile)"
    enabled: true
    outcome_type: binary_winner
    emoji: "♟️"
    platforms: ["ios", "android"]
    result_screen: "You won / checkmate / resign game-over card"
    ai_hints:
      - "Chess.com (or similar) game over — You won, checkmate, or resignation"
      - "Reject mid-game board without result card"
    duration_hint_min: 30

  - game_id: mobile.ludo
    display_name: "Ludo"
    enabled: true
    outcome_type: binary_winner
    emoji: "🎲"
    platforms: ["ios", "android"]
    result_screen: "1v1 winner / podium (not 4-player free-for-all)"
    ai_hints:
      - "Ludo King (or Ludo) 1v1 winner screen or podium"
      - "Reject 4-player free-for-all without agreed 1v1 pairing"
    duration_hint_min: 20
    notes: "1v1 only"

  - game_id: mobile.carrom
    display_name: "Carrom"
    enabled: true
    outcome_type: binary_winner
    emoji: "⚪"
    platforms: ["ios", "android"]
    result_screen: "Match win screen"
    ai_hints:
      - "Carrom multiplayer match winner banner"
      - "Reject mid-board only"
    duration_hint_min: 15

  - game_id: mobile.asphalt
    display_name: "Asphalt race 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🏎️"
    platforms: ["ios", "android"]
    result_screen: "Race finish P1 vs P2 / positions"
    ai_hints:
      - "Asphalt multiplayer race result — finish order between two agreed players"
      - "1st between the two stakers is the winner"
    duration_hint_min: 10

  - game_id: mobile.rocket_league_sideswipe
    display_name: "RL Sideswipe"
    enabled: true
    outcome_type: scoreline
    emoji: "🚀"
    platforms: ["ios", "android"]
    result_screen: "Final 1v1 goals both sides"
    ai_hints:
      - "Rocket League Sideswipe final score — goals each side"
      - "Reject mid-match scoreboard only if match not finished"
    duration_hint_min: 10

  - game_id: mobile.tekken
    display_name: "Tekken (mobile)"
    enabled: true
    outcome_type: binary_winner
    emoji: "🥊"
    platforms: ["ios", "android"]
    result_screen: "You Win / KO result"
    ai_hints:
      - "Tekken mobile You Win / You Lose / KO end"
      - "Reject mid-round health bars only"
    duration_hint_min: 10

  # ═══════════════════════════════════════════════════════════════════════
  # Deferred — not finite without house rules
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.cod_warzone_br
    display_name: "COD Warzone / BR"
    enabled: false
    outcome_type: binary_winner
    emoji: "🪂"
    platforms: ["ios", "android"]
    result_screen: "n/a — multi-survivor placement"
    ai_hints: []
    notes: "Deferred — not 1v1 without special house rules"

  - game_id: mobile.pubg_classic_br
    display_name: "PUBG Classic BR"
    enabled: false
    outcome_type: binary_winner
    emoji: "🪂"
    platforms: ["ios", "android"]
    result_screen: "n/a — placement not binary"
    ai_hints: []
    notes: "Deferred — use TDM / 1v1 custom instead"

  - game_id: mobile.free_fire_br
    display_name: "Free Fire BR"
    enabled: false
    outcome_type: binary_winner
    emoji: "🪂"
    platforms: ["ios", "android"]
    result_screen: "n/a — Booyah placement"
    ai_hints: []
    notes: "Deferred — use 1v1 / Clash Squad"
