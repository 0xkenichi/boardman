# Mobile games catalog — finite-outcome 1v1 / agreed modes only
# See docs/MOBILE_GAMES.md · docs/WEBAPP_AND_MINIPAY.md
#
# Rules:
#   - Clear final screen (Victory/Defeat or scoreline)
#   - Private room / 1v1 / deathmatch / TDM — NOT open battle royale placement

category: mobile
default_proof: screenshot
default_stake_min_usdc: 1
default_stake_max_usdc: 25

games:
  # ═══════════════════════════════════════════════════════════════════════
  # Sports / sims
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.fc_mobile
    display_name: "FC Mobile"
    enabled: true
    outcome_type: scoreline
    emoji: "⚽"
    platforms: ["ios", "android"]
    result_screen: "Full-time scoreline, both team scores, FT / match end"
    ai_hints:
      - "EA Sports FC Mobile final whistle / full time screen"
      - "Extract home and away goals as integers"
      - "Look for FT, Full Time, or match result scoreboard"
      - "Not console EA FC — mobile UI layout"
    duration_hint_min: 20
    notes: "Flagship mobile sports title"

  - game_id: mobile.efootball
    display_name: "eFootball"
    enabled: true
    outcome_type: scoreline
    emoji: "⚽"
    platforms: ["ios", "android"]
    result_screen: "Final score both teams"
    ai_hints:
      - "eFootball mobile final score"
      - "Full time scoreline"
    duration_hint_min: 20

  - game_id: mobile.nba_2k_mobile
    display_name: "NBA 2K Mobile"
    enabled: true
    outcome_type: scoreline
    emoji: "🏀"
    platforms: ["ios", "android"]
    result_screen: "Final box score / end of game"
    ai_hints:
      - "NBA 2K Mobile final score"
      - "Two team point totals"
    duration_hint_min: 25

  # ═══════════════════════════════════════════════════════════════════════
  # Free Fire
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.free_fire_1v1
    display_name: "Free Fire 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔥"
    platforms: ["ios", "android"]
    result_screen: "Victory / Defeat on 1v1 or Clash (not BR rank)"
    ai_hints:
      - "Garena Free Fire 1v1 or clash result"
      - "Victory or Defeat banner"
      - "Not battle royale placement / Booyah rank list"
    duration_hint_min: 15
    notes: "Private 1v1 / duel only"

  - game_id: mobile.free_fire_cs
    display_name: "Free Fire Clash Squad"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔥"
    platforms: ["ios", "android"]
    result_screen: "Clash Squad win screen — team Victory/Defeat"
    ai_hints:
      - "Free Fire Clash Squad end screen"
      - "Victory or Defeat"
      - "Not classic BR"
    duration_hint_min: 20
    notes: "Agreed 2v2/4v4 CS — still one economic rep per side if staking as 1v1 wallets"

  # ═══════════════════════════════════════════════════════════════════════
  # COD Mobile
  # ═══════════════════════════════════════════════════════════════════════
  - game_id: mobile.cod_mobile_dm
    display_name: "COD Mobile Deathmatch"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "MP end scoreboard / winner for DM or agreed 1v1"
    ai_hints:
      - "Call of Duty Mobile multiplayer end screen"
      - "Deathmatch or free-for-all scoreboard"
      - "Not Warzone/BR placement only"
    duration_hint_min: 15

  - game_id: mobile.cod_mobile_tdm
    display_name: "COD Mobile TDM"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "Team Deathmatch win / final team scores"
    ai_hints:
      - "COD Mobile TDM result"
      - "Team score Victory Defeat"
    duration_hint_min: 15

  - game_id: mobile.cod_mobile_1v1
    display_name: "COD Mobile 1v1"
    enabled: true
    outcome_type: binary_winner
    emoji: "🔫"
    platforms: ["ios", "android"]
    result_screen: "1v1 private match Victory/Defeat"
    ai_hints:
      - "COD Mobile 1v1 or private match result"
      - "Victory Defeat"
    duration_hint_min: 15
    notes: "Private lobby preferred"

  # ═══════════════════════════════════════════════════════════════════════
  # PUBG / BGMI
  # ═══════════════════════════════════════════════════════════════════════
