# Fly.io — Rematch API + Telegram bot
# From repo root:
#   fly launch --config deploy/fly.toml --no-deploy --name rematch-api
#   fly secrets set ... (from .env)
#   fly deploy --config deploy/fly.toml --dockerfile Dockerfile.akash

app = "rematch-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.akash"

[env]
  CLAWSTATION_BOT_MODE = "polling"
  CLAW_DEFAULT_CHAIN = "arc"
  PORT = "8000"
  PYTHONUNBUFFERED = "1"
  NETWORK = "testnet"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
