# Fly.io free allowance config (requires free Fly account)
# Docs: https://fly.io/docs/about/pricing/
#
# From repo root:
#   fly launch --config gaming/deploy/fly.toml --no-deploy
#   fly secrets set TELEGRAM_BOT_TOKEN_CLAWSTATION=... SUPABASE_URL=... ...
#   fly deploy --config gaming/deploy/fly.toml
#
# Note: free shared CPU is limited. Start with ONE process (combined API+bot)
# using process group "app".

app = "clawstation-free"
primary_region = "iad"

[build]
  dockerfile = "gaming/Dockerfile"
  # context is repo root when you run fly deploy from root

[env]
  CLAWSTATION_BOT_MODE = "polling"
  CLAW_DEFAULT_CHAIN = "arc"
  CLAW_MAX_STAKE_USDC = "25"
  CLAW_MAX_WITHDRAW_USDC = "50"
  CLAW_DAILY_WITHDRAW_CAP_USDC = "100"
  CLAW_PAUSED = "0"
  WALLET_WATCH_INTERVAL_SEC = "45"
  PORT = "8000"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]

[processes]
  api = "uvicorn gaming.src.backend.main:app --host 0.0.0.0 --port 8000"
  # Bot as second process if your free allowance allows:
  # bot = "python -m gaming.src.bot.main"
