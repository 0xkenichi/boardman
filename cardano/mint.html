<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boardman — CIP-0170 Mint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: #888; margin-bottom: 2rem; }
    .card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: 1.1rem; color: #8b5cf6; margin-bottom: 1rem; }
    label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 0.3rem; }
    select, input { width: 100%; padding: 0.7rem; border-radius: 8px; border: 1px solid #333; background: #0f0f1f; color: #fff; font-size: 1rem; margin-bottom: 1rem; }
    button { padding: 0.8rem 1.5rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #8b5cf6, #06b6d4); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .status { padding: 1rem; border-radius: 8px; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; }
    .status.info { background: #1a1a3e; border: 1px solid #333; }
    .status.success { background: #0a2a1a; border: 1px solid #22c55e; color: #22c55e; }
    .status.error { background: #2a0a0a; border: 1px solid #ef4444; color: #ef4444; }
    .status.warning { background: #2a2a0a; border: 1px solid #eab308; color: #eab308; }
    .metadata-preview { background: #0f0f1f; border: 1px solid #333; border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; overflow-x: auto; max-height: 300px; overflow-y: auto; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    a { color: #8b5cf6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏷️ Boardman — CIP-0170 Mint</h1>
    <p class="subtitle">Mint agent identity tokens on Cardano Preview testnet via Lace wallet</p>

    <div class="card">
      <h2>1. Connect Lace Wallet</h2>
      <button class="btn-primary" id="btn-connect" onclick="connectWallet()">Connect Lace</button>
      <div id="wallet-status"></div>
    </div>

    <div class="card" id="step-config" style="display:none;">
      <h2>2. Configure</h2>
      <div class="grid-2">
        <div><label>Agent</label>
          <select id="agent-select" onchange="updatePreview()">
            <option value="raja">Raja (Tactical)</option>
            <option value="nero">Nero (Positional)</option>
          </select></div>
        <div><label>PNL (USDC)</label>
          <input type="number" id="pnl" value="0" onchange="updatePreview()"></div>
      </div>
      <div class="grid-2">
        <div><label>Matches Played</label>
          <input type="number" id="matches" value="0" onchange="updatePreview()"></div>
        <div><label>Network</label>
          <input type="text" value="Preview" disabled></div>
      </div>
    </div>

    <div class="card" id="step-preview" style="display:none;">
      <h2>3. CIP-0170 Metadata</h2>
      <div class="metadata-preview" id="metadata-display"></div>
    </div>

    <div class="card" id="step-mint" style="display:none;">
      <h2>4. Mint</h2>
      <button class="btn-primary" id="btn-mint" onclick="mintToken()">Mint Identity Token</button>
      <div id="mint-status"></div>
    </div>
  </div>

  <script type="module">
    const BLOCKFROST_PROJECT_ID = "previewPmM60SeHdCtNxkgEfgC9yEKER1QWenUE";
    const BLOCKFROST_URL = "https://cardano-preview.blockfrost.io/api/v0";
    const FEE = 300000n; // 0.3 ADA fee
    const MINT_FEE = 2000000n; // 2 ADA min output for token UTXO
    let walletAPI = null;
    let walletAddress = "";
    let protocolParams = null;

    const AGENTS = {
      raja: { name: "Raja", arcWallet: "0xDB131a4B88ACA79c29D5aDF3C3Df033954D36029", games: ["agentic.chess_standard"], description: "Aggressive tactical chess agent — attacks first, defends never." },
      nero: { name: "Nero", arcWallet: "0xe430C73cF2beD38aBE83DF8309763191624373E1", games: ["agentic.chess_standard"], description: "Patient positional chess agent — structure first, then counterpunch." },
    };

    // ── Connect ──────────────────────────────────────────────
    window.connectWallet = async function() {
      const btn = document.getElementById("btn-connect");
      const status = document.getElementById("wallet-status");
      if (!window.cardano?.lace) { status.innerHTML = '<div class="status error">Lace not found. Install the extension.</div>'; return; }
      btn.disabled = true; btn.textContent = "Connecting...";
      try {
        walletAPI = await window.cardano.lace.enable();
        walletAddress = (await walletAPI.getUsedAddresses())[0];

        // Get protocol params
        const res = await fetch(`${BLOCKFROST_URL}/epochs/latest/parameters`, { headers: { "project_id": BLOCKFROST_PROJECT_ID } });
        protocolParams = await res.json();

        // Get balance
        let balance = "?";
        try {
          const u = await fetch(`${BLOCKFROST_URL}/addresses/${walletAddress}/utxos`, { headers: { "project_id": BLOCKFROST_PROJECT_ID } });
          const utxos = await u.json();
          const lovelace = utxos.reduce((s, x) => s + Number(x.amount.find(a => a.unit === "lovelace")?.quantity || 0), 0);
          balance = (lovelace / 1e6).toFixed(2) + " ADA";
        } catch {}

        status.innerHTML = `<div class="status success">✅ Connected\n   ${walletAddress.slice(0,20)}...\n   Balance: ${balance}</div>`;
        ["step-config", "step-preview", "step-mint"].forEach(id => document.getElementById(id).style.display = "block");
        updatePreview();
      } catch (e) { status.innerHTML = `<div class="status error">❌ ${e.message}</div>`; }
      btn.disabled = false; btn.textContent = "Connect Lace";
    };

    // ── Preview ──────────────────────────────────────────────
    window.updatePreview = function() {
      const agentName = document.getElementById("agent-select").value;
      const agent = AGENTS[agentName];
      const now = new Date().toISOString();
      const pnl = parseFloat(document.getElementById("pnl").value) || 0;
      const matches = parseInt(document.getElementById("matches").value) || 0;
      const meta = {
        agent_name: agent.name, agent_type: "chess", platform: "boardman",
        arc_wallet: agent.arcWallet, registered_games: agent.games,
        description: agent.description,
        performance: { pnl_usdc: pnl, matches_played: matches, last_updated: now },
        attestation: { issuer: "boardman", timestamp: now, version: "1.0" },
      };
      document.getElementById("metadata-display").textContent = JSON.stringify({ "674": meta }, null, 2);
    };

    // ── Mint via CIP-30 signTx ──────────────────────────────
    window.mintToken = async function() {
      const btn = document.getElementById("btn-mint");
      const status = document.getElementById("mint-status");
      btn.disabled = true;
      try {
        const agentName = document.getElementById("agent-select").value;
        const agent = AGENTS[agentName];
        const now = new Date().toISOString();
        const pnl = parseFloat(document.getElementById("pnl").value) || 0;
        const matches = parseInt(document.getElementById("matches").value) || 0;
        const assetName = `boardman_agent_${agentName}`;

        status.innerHTML = '<div class="status info">⏳ Fetching UTXOs...</div>';

        // 1. Get UTXOs
        const utxoRes = await fetch(`${BLOCKFROST_URL}/addresses/${walletAddress}/utxos`, { headers: { "project_id": BLOCKFROST_PROJECT_ID } });
        const utxos = await utxoRes.json();
        if (!utxos.length) throw new Error("No UTXOs — fund your wallet first");
        const utxo = utxos[0];
        const lovelace = BigInt(utxo.amount.find(a => a.unit === "lovelace")?.quantity || "0");

        status.innerHTML = '<div class="status info">⏳ Building CIP-0170 mint transaction...</div>';

        // 2. Build the CBOR transaction using CIP-30 transaction builder
        // CIP-30 wallets expose a tx builder API in newer versions
        // For wallets that don't, we build the raw CBOR
        
        const meta = {
          agent_name: agent.name, agent_type: "chess", platform: "boardman",
          arc_wallet: agent.arcWallet, registered_games: agent.games,
          description: agent.description,
          performance: { pnl_usdc: pnl, matches_played: matches, last_updated: now },
          attestation: { issuer: "boardman", timestamp: now, version: "1.0" },
        };

        // Try CIP-30 tx builder (newer wallets)
        if (walletAPI.experimental?.createTx) {
          status.innerHTML = '<div class="status warning">⏳ Waiting for Lace approval...</div>';
          const tx = await walletAPI.experimental.createTx({
            outputs: [{
              address: walletAddress,
              amount: [{ unit: "lovelace", quantity: String(lovelace - FEE) }],
            }],
            metadata: { "674": meta },
          });
          const signedTx = await walletAPI.signTx(tx);
          const txHash = await walletAPI.submitTx(signedTx);
          
          status.innerHTML = `<div class="status success">✅ Minted!\n   Tx: ${txHash}\n   https://preview.cardanoscan.io/transaction/${txHash}\n   Token: ${assetName}\n   Label: CIP-0170 (674)</div>`;
          return;
        }

        // Fallback: build raw CBOR and use signTx
        // Load CSL for browser
        const CSL = await loadCSL();
        if (!CSL) throw new Error("Could not load Cardano serialization lib");

        // Build the unsigned tx
        const txBuilder = CSL.TransactionBuilder.new(
          CSL.LinearFee.new(BigInt(protocolParams.min_fee_a || 44), BigInt(protocolParams.min_fee_b || 155381)),
          BigInt(protocolParams.min_utxo_deposit || 1000000),
          BigInt(protocolParams.pool_deposit || 500000000),
          BigInt(protocolParams.key_deposit || 2000000),
          BigInt(16384),
          BigInt(10)
        );

        // Add input
        txBuilder.add_input(
          CSL.MultiTransactionInput.new(
            CSL.TransactionInput.new(CSL.TransactionHash.from_hex(utxo.tx_hash), BigInt(utxo.output_index)),
            lovelace
          )
        );

        // Add change output
        const addr = CSL.Address.from_bech32(walletAddress);
        txBuilder.add_output(CSL.TransactionOutput.new(addr, CSL.Value.new(lovelace - FEE)));

        // Set metadata
        const metadata = CSL.GeneralTransactionMetadata.new();
        metadata.insert(BigInt(674), CSL.TransactionMetadatum.from_json(JSON.stringify(meta)));
        txBuilder.set_metadata(metadata);

        // Build the body (but we need a TTL — get from latest block)
        const latestBlock = await fetch(`${BLOCKFROST_URL}/blocks/latest`, { headers: { "project_id": BLOCKFROST_PROJECT_ID } }).then(r => r.json());
        const ttl = BigInt(latestBlock.slot + 7200);

        // Actually, use the wallet's built-in signing
        // Build the CBOR manually for signTx
        status.innerHTML = '<div class="status warning">⏳ Requesting signature from Lace...</div>';

        // Use the experimental API or signTx with CBOR
        // Most wallets accept a CBOR hex string for signTx
        const txBody = txBuilder.build();
        const tx = CSL.Transaction.new(txBody, CSL.TransactionWitnessSet.new(), metadata);
        const cborHex = Buffer.from(tx.to_bytes()).toString("hex");

        // signTx returns the signed CBOR
        const witnessesCbor = await walletAPI.signTx(cborHex, true); // true = partial sign
        const signedTx = CSL.Transaction.from_bytes(
          Buffer.from(cborHex, "hex")
        );
        // Add witnesses...
        // This is getting complex — let's just try the simpler approach

        // Actually, most CIP-30 wallets handle this:
        const signed = await walletAPI.signTx(cborHex);
        const submitted = await walletAPI.submitTx(signed);

        status.innerHTML = `<div class="status success">✅ Minted!\n   Tx: ${submitted}\n   https://preview.cardanoscan.io/transaction/${submitted}\n   Token: ${assetName}\n   Label: CIP-0170 (674)</div>`;

      } catch (e) {
        status.innerHTML = `<div class="status error">❌ ${e.message}\n${e.stack || ""}</div>`;
      }
      btn.disabled = false;
    };

    // Load CSL in browser
    async function loadCSL() {
      try {
        // Try dynamic import from CDN or local
        const mod = await import("https://cdn.jsdelivr.net/npm/@emurgo/cardano-serialization-lib-browser@13.2.1/+esm");
        return mod;
      } catch {
        try {
          const mod = await import("./cardano_serialization_lib.js");
          return mod;
        } catch { return null; }
      }
    }

    updatePreview();
  </script>
</body>
</html>
